<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Watchlist TV Tracker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1800px;
            margin: 1rem auto;
            padding: 0 1rem;
            background: #111827;
            color: #f3f4f6;
            font-size: 0.85rem;
        }
        .container {
            background: #1f2937;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #f9fafb;
        }
        #searchUrlInput {
            background: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 280px;
        }
        #searchUrlInput::placeholder {
            color: #9ca3af;
        }
        #searchUrlInput:focus {
            outline: none;
            border-color: #60a5fa;
        }
        button.clear-btn {
            background: #374151;
            color: #d1d5db;
            border: 1px solid #4b5563;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.clear-btn:hover {
            background: #4b5563;
            color: #fff;
        }
        .upload-section {
            margin-bottom: 1rem;
            padding: 1.5rem;
            border: 2px dashed #4b5563;
            border-radius: 6px;
            text-align: center;
            background-color: #374151;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .upload-section.dragover {
            background-color: #4b5563;
            border-color: #60a5fa;
        }
        .upload-section p {
            margin: 0;
            color: #9ca3af;
            pointer-events: none;
            font-size: 1rem;
        }
        #status-text {
            font-size: 1.1rem;
            margin: 0 0 1rem 0;
            font-weight: bold;
            color: #d1d5db;
        }
        
        /* Section Styles */
        .status-section {
            margin-top: 1.5rem;
            display: none;
        }
        .status-section h2 {
            font-size: 1.2rem;
            margin: 0 0 0.75rem 0;
            color: #e5e7eb;
            border-bottom: 1px solid #374151;
            padding-bottom: 0.4rem;
        }
        
        /* CSS Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 0.75rem;
        }

        .show-card {
            border: 1px solid #374151;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeIn 0.3s ease-in;
            background-color: #111827;
            min-height: 4rem;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        
        .card-upcoming {
            background-color: rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10b981;
        }
        .card-running {
            background-color: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
        }
        .card-ended {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
        }
        .card-tbd {
            border-left: 4px solid #9ca3af;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .show-info h3 {
            margin: 0;
            color: #e5e7eb;
            font-size: 1.05rem;
            line-height: 1.3;
            margin-bottom: 0.3rem;
        }
        .links-container {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .show-link {
            font-size: 0.7rem;
            background: #374151;
            color: #9ca3af;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            text-decoration: none;
            font-weight: normal;
        }
        .show-link:hover {
            background: #4b5563;
            color: #e5e7eb;
        }
        .status {
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .next-date {
            font-weight: 600;
            text-align: right;
            font-size: 0.85rem;
        }
        
        .card-upcoming .next-date { color: #34d399; }
        .card-running .no-date { color: #60a5fa; font-weight: normal; }
        .card-ended .no-date { color: #f87171; font-weight: normal; }
        .card-tbd .no-date { color: #9ca3af; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h1>IMDb Watchlist TV Tracker</h1>
        <div class="header-controls">
            <input type="text" id="searchUrlInput" placeholder="Custom Search URL (e.g. https://.../search/)">
            <button class="clear-btn" onclick="clearData()" id="clearBtn" style="display: none;">Clear Saved List</button>
        </div>
    </div>
    
    <div class="upload-section" id="dropZone">
        <p>Drag and drop your IMDb .csv file here to load or update your list</p>
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <div id="status-text">Waiting for CSV file...</div>
    
    <div id="sections-wrapper">
        <div id="sec-upcoming" class="status-section">
            <h2>Upcoming Episodes</h2>
            <div class="cards-grid"></div>
        </div>
        
        <div id="sec-running" class="status-section">
            <h2>Running (No scheduled dates)</h2>
            <div class="cards-grid"></div>
        </div>
        
        <div id="sec-tbd" class="status-section">
            <h2>To Be Determined</h2>
            <div class="cards-grid"></div>
        </div>
        
        <div id="sec-ended" class="status-section">
            <h2>Ended</h2>
            <div class="cards-grid"></div>
        </div>

        <div id="sec-unknown" class="status-section">
            <h2>Not Found / Error</h2>
            <div class="cards-grid"></div>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const clearBtn = document.getElementById('clearBtn');
    const statusDiv = document.getElementById('status-text');
    const searchUrlInput = document.getElementById('searchUrlInput');
    
    const sections = {
        upcoming: { wrapper: document.getElementById('sec-upcoming'), grid: document.querySelector('#sec-upcoming .cards-grid') },
        running: { wrapper: document.getElementById('sec-running'), grid: document.querySelector('#sec-running .cards-grid') },
        tbd: { wrapper: document.getElementById('sec-tbd'), grid: document.querySelector('#sec-tbd .cards-grid') },
        ended: { wrapper: document.getElementById('sec-ended'), grid: document.querySelector('#sec-ended .cards-grid') },
        unknown: { wrapper: document.getElementById('sec-unknown'), grid: document.querySelector('#sec-unknown .cards-grid') }
    };

    document.addEventListener('DOMContentLoaded', () => {
        // Load custom search URL
        const savedUrl = localStorage.getItem('custom_search_url');
        if (savedUrl) searchUrlInput.value = savedUrl;

        // Load saved shows
        const savedShows = localStorage.getItem('imdb_watchlist_shows');
        if (savedShows) {
            const shows = JSON.parse(savedShows);
            clearBtn.style.display = 'block';
            fetchSchedules(shows);
        }
    });

    // Update search links dynamically as the user types
    searchUrlInput.addEventListener('input', (e) => {
        const newUrl = e.target.value.trim();
        localStorage.setItem('custom_search_url', newUrl);
        
        const searchLinks = document.querySelectorAll('.dynamic-search-link');
        const fallbackUrl = 'https://replace.me/search/';
        const baseUrl = newUrl || fallbackUrl;

        searchLinks.forEach(link => {
            const title = link.dataset.title;
            link.href = baseUrl + encodeURIComponent(title);
        });
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            processCSV(e.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSV(str) {
        const arr = [];
        let quote = false;
        for (let row = 0, col = 0, c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';
            if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
            if (cc == '"') { quote = !quote; continue; }
            if (cc == ',' && !quote) { ++col; continue; }
            if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
            if (cc == '\n' && !quote) { ++row; col = 0; continue; }
            if (cc == '\r' && !quote) { ++row; col = 0; continue; }
            arr[row][col] += cc;
        }
        return arr;
    }

    function processCSV(csvText) {
        const data = parseCSV(csvText);
        if (data.length < 2) return;
        
        const headers = data[0];
        const titleIdx = headers.findIndex(h => h === 'Title');
        const typeIdx = headers.findIndex(h => h === 'Title Type');
        const constIdx = headers.findIndex(h => h === 'Const');

        if (titleIdx === -1) {
            statusDiv.innerHTML = '<span style="color:#f87171">Invalid CSV format: Missing Title column.</span>';
            return;
        }

        const shows = [];
        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            if (!row || row.length <= titleIdx) continue;
            
            const type = typeIdx !== -1 ? row[typeIdx] : '';
            if (type && !type.toLowerCase().includes('tv')) continue;
            
            shows.push({
                title: row[titleIdx],
                imdbId: constIdx !== -1 ? row[constIdx] : null
            });
        }

        localStorage.setItem('imdb_watchlist_shows', JSON.stringify(shows));
        clearBtn.style.display = 'block';
        
        fetchSchedules(shows);
    }

    function clearData() {
        localStorage.removeItem('imdb_watchlist_shows');
        Object.values(sections).forEach(sec => {
            sec.grid.innerHTML = '';
            sec.wrapper.style.display = 'none';
        });
        statusDiv.innerText = 'Saved data cleared. Waiting for CSV file...';
        clearBtn.style.display = 'none';
        fileInput.value = '';
    }

    async function fetchSchedules(shows) {
        Object.values(sections).forEach(sec => {
            sec.grid.innerHTML = '';
            sec.wrapper.style.display = 'none';
        });
        
        for (let i = 0; i < shows.length; i++) {
            statusDiv.innerText = `Fetching schedules... (${i + 1}/${shows.length})`;
            const showData = await fetchShowData(shows[i]);
            insertIntoSection(showData);
        }
        
        statusDiv.innerText = `Results (${shows.length} TV shows stored)`;
    }

    function insertIntoSection(item) {
        let targetSec;
        let cardClass = 'show-card';
        
        if (item.hasEpisode) {
            targetSec = sections.upcoming;
            cardClass += ' card-upcoming';
        } else if (item.statusRank === 1) {
            targetSec = sections.running;
            cardClass += ' card-running';
        } else if (item.statusRank === 2) {
            targetSec = sections.tbd;
            cardClass += ' card-tbd';
        } else if (item.statusRank === 3) {
            targetSec = sections.ended;
            cardClass += ' card-ended';
        } else {
            targetSec = sections.unknown;
        }

        targetSec.wrapper.style.display = 'block';

        const card = document.createElement('div');
        card.className = cardClass;
        card.dataset.time = item.airDateObj ? item.airDateObj.getTime() : 0;
        card.dataset.title = item.title.toLowerCase();
        
        const imdbLink = item.linkUrl ? `<a href="${item.linkUrl}" class="show-link" target="_blank" rel="noopener noreferrer">IMDb</a>` : '';
        
        // Grab current URL from input or use fallback
        const baseUrl = searchUrlInput.value.trim() || 'https://replace.me/search/';
        const searchLink = `<a href="${baseUrl}${encodeURIComponent(item.title)}" data-title="${item.title.replace(/"/g, '&quot;')}" class="show-link dynamic-search-link" target="_blank" rel="noopener noreferrer">Search</a>`;
        
        const dateClass = item.hasEpisode ? 'next-date' : 'next-date no-date';

        card.innerHTML = `
            <div class="card-top">
                <div class="show-info">
                    <h3>${item.title}</h3>
                    <div class="status">${item.statusText}</div>
                </div>
                <div class="${dateClass}">
                    ${item.airDateStr}
                </div>
            </div>
            <div class="links-container">
                ${imdbLink}
                ${searchLink}
            </div>
        `;

        const existingCards = Array.from(targetSec.grid.children);
        
        for (let i = 0; i < existingCards.length; i++) {
            const current = existingCards[i];
            
            if (item.hasEpisode) {
                if (parseInt(card.dataset.time) < parseInt(current.dataset.time)) {
                    targetSec.grid.insertBefore(card, current);
                    return;
                }
            } else {
                if (card.dataset.title < current.dataset.title) {
                    targetSec.grid.insertBefore(card, current);
                    return;
                }
            }
        }
        
        targetSec.grid.appendChild(card);
    }

    async function fetchShowData(show) {
        try {
            let showData;
            
            if (show.imdbId) {
                const lookupRes = await fetch(`https://api.tvmaze.com/lookup/shows?imdb=${show.imdbId}`);
                if (lookupRes.ok) showData = await lookupRes.json();
            }
            
            if (!showData) {
                const searchRes = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(show.title)}`);
                if (!searchRes.ok) throw new Error('Show not found');
                showData = await searchRes.json();
            }

            const linkUrl = show.imdbId ? `https://www.imdb.com/title/${show.imdbId}/` : showData.url;

            let statusRank = 4;
            if (showData.status) {
                const statusLower = showData.status.toLowerCase();
                if (statusLower === 'running') statusRank = 1;
                else if (statusLower === 'to be determined') statusRank = 2;
                else if (statusLower === 'ended') statusRank = 3;
            }

            if (showData._links && showData._links.nextepisode) {
                const epRes = await fetch(showData._links.nextepisode.href);
                const epData = await epRes.json();
                const airDateObj = new Date(epData.airstamp);
                
                return {
                    title: showData.name,
                    linkUrl: linkUrl,
                    statusText: `S${String(epData.season).padStart(2, '0')}E${String(epData.number).padStart(2, '0')}: "${epData.name}"`,
                    hasEpisode: true,
                    airDateObj: airDateObj,
                    airDateStr: airDateObj.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }),
                    statusRank: 0
                };
            } else {
                return {
                    title: showData.name,
                    linkUrl: linkUrl,
                    statusText: `Status: ${showData.status}`,
                    hasEpisode: false,
                    airDateObj: null,
                    airDateStr: 'No upcoming episodes',
                    statusRank: statusRank
                };
            }
        } catch (error) {
            return {
                title: show.title,
                linkUrl: show.imdbId ? `https://www.imdb.com/title/${show.imdbId}/` : null,
                statusText: 'Data not found.',
                hasEpisode: false,
                airDateObj: null,
                airDateStr: 'N/A',
                statusRank: 5
            };
        }
    }
</script>

</body>
</html>
